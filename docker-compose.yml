services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gophkeeper
      POSTGRES_USER: gophkeeper
      POSTGRES_PASSWORD: gophkeeper123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gophkeeper -d gophkeeper"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      DATABASE_URI: "host=postgres user=gophkeeper password=gophkeeper123 dbname=gophkeeper sslmode=disable"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      RUN_ADDRESS: ":8090"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: